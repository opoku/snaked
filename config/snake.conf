%% Snaked Game Logger Configuration
%% This configuration file sets up Erlang's logger module for the Snaked game

[
 %% Kernel configuration
 {kernel, [
     {logger_level, info},  %% Global log level (all, debug, info, notice, warning, error, critical, alert, emergency, none)
     
     %% Logger configuration
     {logger, [
         %% Default handler configuration (console)
         {handler, default, logger_std_h, #{
             level => info,
             config => #{
                 type => standard_io
             },
             formatter => {logger_formatter, #{
                 single_line => false,
                 template => [time, " [", level, "] ", pid, " ", mfa, ":", line, " - ", msg, "\n"],
                 time_designator => $\s,
                 time_offset => "Z"
             }}
         }},
         
         %% File handler for all logs
         {handler, file_all, logger_std_h, #{
             level => debug,
             config => #{
                 file => "logs/snaked_all.log",
                 max_no_bytes => 10485760,  %% 10MB
                 max_no_files => 5,
                 compress_on_rotate => true
             },
             formatter => {logger_formatter, #{
                 single_line => false,
                 template => [time, " [", level, "] ", pid, " [", mfa, ":", line, "] ", msg, "\n"],
                 time_designator => $\s,
                 time_offset => "Z"
             }}
         }},
         
         %% File handler for errors only
         {handler, file_error, logger_std_h, #{
             level => error,
             config => #{
                 file => "logs/snaked_error.log",
                 max_no_bytes => 5242880,  %% 5MB
                 max_no_files => 3,
                 compress_on_rotate => true
             },
             formatter => {logger_formatter, #{
                 single_line => false,
                 template => [time, " [", level, "] ", pid, " [", mfa, ":", line, "] ", msg, "\n"],
                 time_designator => $\s,
                 time_offset => "Z"
             }}
         }}
     ]}
 ]}
].
